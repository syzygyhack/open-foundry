version: 2

updates:
  # Actions are pinned to commit SHAs for supply-chain integrity, which means
  # they cannot float to picked-up security fixes — Dependabot is what keeps the
  # pins current. It rewrites the SHA and the trailing version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'
    groups:
      # Minor/patch only. Grouping majors produces an unreviewable PR that mixes
      # breaking upgrades (e.g. checkout v4 -> v7) with routine bumps; majors
      # arrive as individual PRs so each can be assessed on its own.
      actions:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # One PR per ecosystem area keeps the review load sane in a 19-package
      # workspace; security updates still arrive individually and immediately.
      dev-tooling:
        dependency-type: development
        patterns: ['*']
        update-types: ['minor', 'patch']
      production:
        dependency-type: production
        patterns: ['*']
        update-types: ['minor', 'patch']

  # gomod is deliberately absent. Dependabot's Go helper currently fails on this
  # module with `go_module_path_mismatch` (it misreads a "go: downloading" line
  # as a module path), so the ecosystem would fail every week and train everyone
  # to ignore a red Dependabot run. Go dependencies are covered instead by the
  # trivy image scan in CI plus the scheduled drift scan, which is strictly
  # broader here: it catches Go *stdlib* advisories that come from the toolchain
  # rather than go.mod, and Dependabot cannot see those at all.

  - package-ecosystem: docker
    directory: /packages/cel-evaluator
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deps)'
