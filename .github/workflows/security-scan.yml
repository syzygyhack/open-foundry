name: Scheduled security scan

# Newly published CVEs affect unchanged dependencies, so image scanning drifts
# red over time. The CI gate still blocks a PR that *introduces* a vulnerable
# dependency; this job catches drift on its own cadence and files an issue,
# instead of surfacing as a red build on an unrelated contributor's commit.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  TRIVY_VERSION: '0.71.0'
  # Default DB resolution goes via a mirror that has both 404'd and throttled
  # with 429s; name the upstream registry explicitly so the scan does not
  # depend on a mirror's quota.
  TRIVY_DB_REPOSITORY: 'ghcr.io/aquasecurity/trivy-db:2'

jobs:
  scan:
    name: Trivy image scan (HIGH/CRITICAL)
    runs-on: ubuntu-latest
    # Throwaway values: compose interpolates the whole file even to build, and
    # nothing is started here.
    env:
      POSTGRES_PASSWORD: postgres
      KEYCLOAK_ADMIN_PASSWORD: admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build all images
        run: docker compose -f deploy/docker-compose.yaml build

      - name: Install trivy (checksum verified)
        run: |
          set -euo pipefail
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "$tarball" "$base/$tarball"
          curl -fsSL -o checksums.txt "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          sudo tar xz -C /usr/local/bin -f "$tarball" trivy

      - name: Scan all images
        id: scan
        run: |
          set -uo pipefail
          status=0
          : > findings.md
          for img in cel-evaluator api-gateway ontology-engine action-executor security-service sync-engine; do
            echo "::group::trivy deploy-$img"
            # JSON is the authoritative output: the issue body is built from it,
            # and the run log gets a rendered table from the same scan.
            if ! trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
                 --format json --output "scan-$img.json" "deploy-$img:latest"; then
              status=1
              {
                echo "### deploy-$img"
                echo
                echo '| Package | Vulnerability | Severity | Installed | Fixed | Title |'
                echo '|---|---|---|---|---|---|'
                # Title is included but truncated: an ID alone does not say
                # whether a finding is reachable, and reading the run log to find
                # out defeats the point of the issue. Trimmed so a long
                # description cannot push the body back toward the size limit.
                # Pipes become `\|`, the single-backslash form Markdown requires
                # — emitting `\\|` would render a literal backslash and leave the
                # pipe splitting the row. Character class avoids re-escaping it.
                jq -r '[.Results[]? | .Vulnerabilities[]?]
                       | unique_by([.VulnerabilityID, .PkgName, .InstalledVersion])
                       | .[]
                       | ((.Title // .Description // "") | gsub("[|]"; "\\|") | gsub("\n"; " ")) as $t
                       | "| \(.PkgName) | \(.VulnerabilityID) | \(.Severity) | \(.InstalledVersion) | \(.FixedVersion // "none") | \($t[0:120]) |"' \
                  "scan-$img.json"
                echo
              } >> findings.md
            fi
            # `--scanners vuln` is required here: without it convert prints only
            # "No enabled scanners found" and renders nothing, which left a green
            # run with no record of what was covered.
            if ! trivy convert --scanners vuln --format table "scan-$img.json"; then
              # Don't fail the job — the JSON above is authoritative and already
              # determined pass/fail — but don't swallow it either, or findings
              # would quietly stop appearing in the log.
              echo "::warning::trivy convert could not render deploy-$img; see the JSON scan result"
            fi
            echo "deploy-$img: $(jq '[.Results[]? | .Vulnerabilities[]?] | length' "scan-$img.json") HIGH/CRITICAL finding(s)"
            echo "::endgroup::"
          done
          exit $status

      - name: File or update a drift issue
        if: failure() && steps.scan.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="Security: HIGH/CRITICAL CVEs detected in container images"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body_file=$(mktemp)
          {
            echo "The scheduled scan found HIGH/CRITICAL vulnerabilities in the built images."
            echo
            echo "Run: $run_url"
            echo
            cat findings.md
          } > "$body_file"
          # GitHub rejects a body over 65536 characters. Embedding raw trivy
          # tables exceeded that, the create failed, and drift then went
          # unreported for days while the scan kept going red. Summarised rows
          # are far smaller, and this guard keeps the body bounded regardless of
          # how many findings land.
          limit=60000
          if [ "$(wc -c < "$body_file")" -gt "$limit" ]; then
            truncated=$(mktemp)
            head -c "$limit" "$body_file" > "$truncated"
            printf '\n\n_Findings truncated. Full report in the run log: %s_\n' "$run_url" >> "$truncated"
            mv "$truncated" "$body_file"
          fi
          existing=$(gh issue list --state open --label security --search "$title in:title" \
                      --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$body_file"
          else
            gh issue create --title "$title" --label security --body-file "$body_file"
          fi
