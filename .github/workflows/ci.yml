name: CI

# Runs the full pre-Stage-1 verification gate on every push to main and on PRs:
# build + unit tests, Postgres integration, full Docker-stack integration,
# helm lint, and a trivy HIGH/CRITICAL image scan. Mirrors the gates documented
# in docs/nhs/fdp-plan.md so the posture is enforced, not just locally verified.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      # Typecheck covers test files too (tsconfig.json), which `build`
      # (tsconfig.build.json) excludes — so this catches type errors in tests
      # that build + vitest (esbuild, no typecheck) would miss.
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm run test

  postgres-integration:
    name: Postgres integration (AGE)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: apache/age:release_PG17_1.6.0
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: openfoundry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # `pnpm --filter ... test` runs the package's vitest directly (bypasses
      # turbo's test->build dependsOn), so workspace deps (e.g. @openfoundry/odl)
      # must be built first or vite can't resolve them.
      - name: Build workspace
        run: pnpm run build
      - name: Initialise Apache AGE
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -d openfoundry_test \
            -c "CREATE EXTENSION IF NOT EXISTS age;" \
            -c "LOAD 'age';" \
            -c "SET search_path = ag_catalog, public;" \
            -c "SELECT create_graph('openfoundry');"
      - name: Storage-postgres integration tests
        env:
          PG_TEST_URL: postgresql://postgres:postgres@localhost:5432/openfoundry_test
        run: pnpm --filter @openfoundry/storage-postgres test

  docker-stack-integration:
    name: Docker-stack integration
    runs-on: ubuntu-latest
    # docker-compose.yaml has two intentionally-required vars (no defaults —
    # fail loud in prod): POSTGRES_PASSWORD and KEYCLOAK_ADMIN_PASSWORD. Supply
    # throwaway values for the CI stack; they stay consistent across containers.
    env:
      POSTGRES_PASSWORD: postgres
      KEYCLOAK_ADMIN_PASSWORD: admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Compose reads deploy/.env (project dir) for the two intentionally-
      # required vars. Writing the file (not just job env) is essential: the
      # integration tests run via turbo, whose strict env mode strips job env
      # from the task, so the harness's `docker compose` children would
      # otherwise not see the vars. This mirrors local dev (deploy/.env exists).
      - name: Create deploy/.env for compose
        run: |
          printf 'POSTGRES_PASSWORD=postgres\nKEYCLOAK_ADMIN_PASSWORD=admin\n' > deploy/.env
      - name: Build stack images
        run: >-
          docker compose
          -f deploy/docker-compose.yaml
          -f deploy/docker-compose.test.yaml
          build
      # Bring the stack up here (not inside the test harness): the harness's
      # dockerComposeUp wraps `up --wait` in a 300s execSync wall-timeout, which
      # a cold 14-service stack can exceed on CI runners. Starting it in a
      # dedicated step uses compose's own --wait-timeout; the harness then sees
      # the stack already healthy (isStackHealthy) and skips its own up.
      - name: Start stack
        run: >-
          docker compose
          -f deploy/docker-compose.yaml
          -f deploy/docker-compose.test.yaml
          up -d --wait --wait-timeout 600
      - name: Integration tests
        run: pnpm run test:integration
      - name: Tear down stack
        if: always()
        run: >-
          docker compose
          -f deploy/docker-compose.yaml
          -f deploy/docker-compose.test.yaml
          down -v --remove-orphans

  enforcement-e2e:
    name: Enforcement E2E (prod security, capability gating, consent vocab)
    runs-on: ubuntu-latest
    # The high-value enforcement specs are env-gated + DESTRUCTIVE: each tears the
    # stack down and boots it in a NON-default mode (NODE_ENV=production / a
    # distinct DOMAIN_PACKS set / a custom consent vocabulary) on the shared
    # ports. They cannot run inside the standard integration suite (which assumes
    # the default dev all-packs stack) nor concurrently with each other. This
    # dedicated job runs them one spec at a time so real OIDC/OpenFGA enforcement,
    # capability gating, and consent-vocab validation are exercised on every
    # push/PR — not only when a developer sets the opt-in env flag locally.
    env:
      POSTGRES_PASSWORD: postgres
      KEYCLOAK_ADMIN_PASSWORD: admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Compose reads deploy/.env (project dir) for the two intentionally-required
      # vars; the specs spawn `docker compose` children that need the file on disk.
      - name: Create deploy/.env for compose
        run: |
          printf 'POSTGRES_PASSWORD=postgres\nKEYCLOAK_ADMIN_PASSWORD=admin\n' > deploy/.env
      # vitest runs the package directly (no turbo build step), so workspace deps
      # must be built first for vite to resolve them.
      - name: Build workspace
        run: pnpm run build
      - name: Build stack images
        run: docker compose -f deploy/docker-compose.yaml build
      # Each spec self-manages the Docker lifecycle (down -v -> up -> assert ->
      # down -v). Run sequentially; the filename filter + env flag keep exactly
      # one destructive spec active at a time.
      - name: Prod-mode security-enforcement E2E
        run: SECURITY_E2E=1 pnpm --filter @openfoundry/integration-tests exec vitest run security-enforcement
      - name: Capability-gating negative E2E
        run: CAPABILITY_E2E=1 pnpm --filter @openfoundry/integration-tests exec vitest run capability-gating
      - name: Open-consent-vocabulary E2E
        run: CONSENT_VOCAB_E2E=1 pnpm --filter @openfoundry/integration-tests exec vitest run open-consent-vocab
      - name: Tear down stack
        if: always()
        run: docker compose -f deploy/docker-compose.yaml down -v --remove-orphans

  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.2
      - name: Lint chart
        run: >-
          helm lint --strict deploy/helm/openfoundry
          --set auth.oidc.clientId=ci
          --set authz.openfga.storeId=ci

  image-scan:
    name: Trivy image scan (HIGH/CRITICAL)
    runs-on: ubuntu-latest
    # `docker compose build` interpolates the whole compose file, which has two
    # required vars (POSTGRES_PASSWORD, KEYCLOAK_ADMIN_PASSWORD). Throwaway
    # values — only the built image layers are scanned, nothing runs.
    env:
      POSTGRES_PASSWORD: postgres
      KEYCLOAK_ADMIN_PASSWORD: admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build all images
        run: docker compose -f deploy/docker-compose.yaml build
      - name: Install trivy (checksum verified)
        env:
          TRIVY_VERSION: '0.71.0'
        run: |
          set -euo pipefail
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "$tarball" "$base/$tarball"
          curl -fsSL -o checksums.txt "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          sudo tar xz -C /usr/local/bin -f "$tarball" trivy
      - name: Scan all images (fail on HIGH/CRITICAL)
        run: |
          status=0
          for img in cel-evaluator api-gateway ontology-engine action-executor security-service sync-engine; do
            echo "::group::trivy deploy-$img"
            trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 "deploy-$img:latest" || status=1
            echo "::endgroup::"
          done
          exit $status
