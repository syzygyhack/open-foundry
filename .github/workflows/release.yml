name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # id-token + attestations are required to publish build provenance; the
  # attestation is verifiable with `gh attestation verify`.
  id-token: write
  attestations: write

jobs:
  # A tag used to publish straight from `pnpm run build && pnpm run test`, which
  # does not typecheck or build the container images — so v0.2.0 shipped with a
  # cel-evaluator image that could not build. Verify the tagged SHA first, and
  # only publish once every artifact exists.
  # A tag must not publish unless the FULL CI matrix passed for this exact SHA.
  # An earlier partial gate (build + typecheck + unit tests + image builds) still
  # let a tag through without Postgres integration, stack integration, the
  # production-mode enforcement suites, Helm lint or the image scan. Rather than
  # duplicate those here — doubling release time and drifting from ci.yml — wait
  # for the CI workflow run on the tagged commit and require every job green.
  verify:
    name: Require full CI green for the tagged commit
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Tags are usually pushed at a commit CI has already run on; allow time
          # for the run to appear and finish if the tag raced the push.
          for attempt in $(seq 1 60); do
            run=$(gh run list --repo "$REPO" --workflow=CI --limit 30 \
                    --json databaseId,headSha,status,conclusion \
                    --jq "[.[] | select(.headSha == \"$SHA\")] | first // empty")
            if [ -z "$run" ]; then
              echo "attempt $attempt: no CI run for $SHA yet"
            else
              status=$(echo "$run" | jq -r .status)
              conclusion=$(echo "$run" | jq -r '.conclusion // ""')
              id=$(echo "$run" | jq -r .databaseId)
              echo "attempt $attempt: CI run $id status=$status conclusion=$conclusion"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" != "success" ]; then
                  echo "::error::CI concluded '$conclusion' for $SHA — refusing to publish."
                  exit 1
                fi
                # Guard against a partially-successful matrix.
                failed=$(gh run view "$id" --repo "$REPO" --json jobs \
                          --jq '[.jobs[] | select(.conclusion != "success")] | length')
                if [ "$failed" != "0" ]; then
                  echo "::error::$failed CI job(s) did not succeed for $SHA — refusing to publish."
                  exit 1
                fi
                echo "CI fully green for $SHA (run $id)."
                exit 0
              fi
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for a completed CI run on $SHA."
          exit 1

  publish:
    name: Publish release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Generate spec artifacts
        run: pnpm --filter @openfoundry/api spec:all

      - name: Install trivy (checksum verified)
        env:
          TRIVY_VERSION: '0.71.0'
        run: |
          set -euo pipefail
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "$tarball" "$base/$tarball"
          curl -fsSL -o checksums.txt "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          sudo tar xz -C /usr/local/bin -f "$tarball" trivy

      # An SBOM lets consumers answer "is this release affected by CVE-X?"
      # without rebuilding it, generated from the resolved workspace.
      - name: Generate SBOM (CycloneDX)
        run: |
          set -euo pipefail
          trivy fs --format cyclonedx --scanners license \
            --output sbom.cyclonedx.json --quiet .
          node -e "const s=require('./sbom.cyclonedx.json');const n=(s.components||[]).length;if(!n)throw new Error('SBOM has no components');console.log('SBOM',s.specVersion,'components:',n)"

      # Created only now, with every asset attached in one call, so a failure
      # above cannot leave a published release missing its artifacts.
      - name: Create DRAFT release with artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # SemVer pre-release tags (containing a hyphen) are marked as GitHub
          # pre-releases so they do not claim the "Latest" badge.
          PRERELEASE=""
          case "${{ github.ref_name }}" in
            *-*) PRERELEASE="--prerelease" ;;
          esac
          assets=(
            packages/api/spec/openapi.yaml
            packages/api/spec/schema.graphql
            packages/api/spec/asyncapi.yaml
            sbom.cyclonedx.json
          )
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" "${assets[@]}" --clobber
          else
            # Draft: nothing is publicly visible until provenance succeeds.
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes \
              --draft \
              $PRERELEASE \
              "${assets[@]}"
          fi

      # Signed, verifiable statement that these artifacts came from this
      # workflow at this commit: `gh attestation verify <file> --repo <repo>`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            packages/api/spec/openapi.yaml
            packages/api/spec/schema.graphql
            packages/api/spec/asyncapi.yaml
            sbom.cyclonedx.json

      # Only now is the release made visible. A failure anywhere above leaves a
      # draft, not a published release advertising assurance it does not have.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false
