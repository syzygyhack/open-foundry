name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # Publishing container images to GHCR.
  packages: write
  # id-token + attestations are required to publish build provenance; the
  # attestation is verifiable with `gh attestation verify`.
  id-token: write
  attestations: write

jobs:
  # A tag used to publish straight from `pnpm run build && pnpm run test`, which
  # does not typecheck or build the container images — so v0.2.0 shipped with a
  # cel-evaluator image that could not build. Verify the tagged SHA first, and
  # only publish once every artifact exists.
  # A tag must not publish unless the FULL CI matrix passed for this exact SHA.
  # An earlier partial gate (build + typecheck + unit tests + image builds) still
  # let a tag through without Postgres integration, stack integration, the
  # production-mode enforcement suites, Helm lint or the image scan. Rather than
  # duplicate those here — doubling release time and drifting from ci.yml — wait
  # for the CI workflow run on the tagged commit and require every job green.
  verify:
    name: Require full CI green for the tagged commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Tags are usually pushed at a commit CI has already run on; allow time
          # for the run to appear and finish if the tag raced the push.
          for attempt in $(seq 1 60); do
            run=$(gh run list --repo "$REPO" --workflow=CI --commit "$SHA" \
                    --branch main --event push --limit 5 \
                    --json databaseId,headSha,headBranch,event,status,conclusion \
                    --jq "[.[] | select(.headSha == \"$SHA\" and .headBranch == \"main\" and .event == \"push\")] | first // empty")
            if [ -z "$run" ]; then
              echo "attempt $attempt: no main-branch CI run for $SHA yet"
            else
              status=$(echo "$run" | jq -r .status)
              conclusion=$(echo "$run" | jq -r '.conclusion // ""')
              id=$(echo "$run" | jq -r .databaseId)
              echo "attempt $attempt: CI run $id status=$status conclusion=$conclusion"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" != "success" ]; then
                  echo "::error::CI concluded '$conclusion' for $SHA — refusing to publish."
                  exit 1
                fi
                # Guard against a partially-successful matrix.
                failed=$(gh run view "$id" --repo "$REPO" --json jobs \
                          --jq '[.jobs[] | select(.conclusion != "success")] | length')
                if [ "$failed" != "0" ]; then
                  echo "::error::$failed CI job(s) did not succeed for $SHA — refusing to publish."
                  exit 1
                fi
                echo "CI fully green for $SHA (run $id)."
                exit 0
              fi
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for a completed CI run on $SHA."
          exit 1

  publish:
    name: Publish release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required by the origin/main ancestry check below.
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # Validate the checked-in release state rather than silently rewriting it.
      # This keeps source, specs, images and the chart on one version and makes
      # a tag on an unmerged commit fail closed.
      - name: Validate release metadata
        id: ver
        run: |
          set -euo pipefail
          package_version=$(node -p "require('./package.json').version")
          chart_version=$(sed -n 's/^version: *//p' deploy/helm/openfoundry/Chart.yaml)
          app_version=$(sed -n 's/^appVersion: *"\([^"]*\)"/\1/p' deploy/helm/openfoundry/Chart.yaml)
          image_tag=$(sed -n '/^image:$/,/^[^ ]/s/^  tag: *"\([^"]*\)"/\1/p' deploy/helm/openfoundry/values.yaml)
          expected_tag="v${package_version}"

          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package version $package_version."
            exit 1
          fi
          if [ "$chart_version" != "$package_version" ] || \
             [ "$app_version" != "$package_version" ] || \
             [ "$image_tag" != "$package_version" ]; then
            echo "::error::Package, chart, appVersion and default image tag must all equal $package_version."
            exit 1
          fi
          if ! grep -Fq "## [$package_version] - " CHANGELOG.md || \
             ! grep -Fq -- "--version $package_version" deploy/README.md; then
            echo "::error::CHANGELOG.md and the install example must name release $package_version."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not reachable from origin/main."
            exit 1
          fi

          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "Release metadata is aligned at $package_version."

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Generate spec artifacts
        run: pnpm --filter @openfoundry/api spec:all

      - name: Validate generated spec versions
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          pnpm --filter @openfoundry/api exec node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { parse } from 'yaml';

          const expected = process.env.VERSION;
          for (const file of ['spec/openapi.yaml', 'spec/asyncapi.yaml']) {
            const actual = parse(readFileSync(file, 'utf8')).info?.version;
            if (actual !== expected) {
              throw new Error(`${file} info.version is ${actual ?? '<missing>'}; expected ${expected}`);
            }
            console.log(`${file}: ${actual}`);
          }
          NODE

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push images
        id: images
        env:
          POSTGRES_PASSWORD: postgres
          KEYCLOAK_ADMIN_PASSWORD: admin
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          docker compose -f deploy/docker-compose.yaml build
          registry="ghcr.io/${{ github.repository }}"
          : > image-digests.txt
          # compose service -> published image name
          while read -r svc name; do
            src="deploy-${svc}:latest"
            dest="${registry}/${name}"
            docker tag "$src" "${dest}:${VERSION}"
            docker push "${dest}:${VERSION}"
            digest=$(docker inspect --format='{{index .RepoDigests 0}}' "${dest}:${VERSION}" 2>/dev/null || true)
            if [ -z "$digest" ]; then
              digest="${dest}@$(docker manifest inspect "${dest}:${VERSION}" -v | jq -r '.Descriptor.digest' | head -1)"
            fi
            echo "$digest" >> image-digests.txt
            echo "pushed $digest"
          done <<'SERVICES'
          api-gateway api-gateway
          ontology-engine ontology-engine
          action-executor action-executor
          security-service security-service
          sync-engine sync-engine
          cel-evaluator cel-evaluator
          SERVICES

      - name: Package Helm chart
        run: |
          set -euo pipefail
          helm package deploy/helm/openfoundry --destination .
          helm push "openfoundry-${{ steps.ver.outputs.version }}.tgz" "oci://ghcr.io/${{ github.repository }}/charts"

      - name: Install trivy (checksum verified)
        env:
          TRIVY_VERSION: '0.71.0'
        run: |
          set -euo pipefail
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL -o "$tarball" "$base/$tarball"
          curl -fsSL -o checksums.txt "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          sudo tar xz -C /usr/local/bin -f "$tarball" trivy

      # An SBOM lets consumers answer "is this release affected by CVE-X?"
      # without rebuilding it, generated from the resolved workspace.
      - name: Generate SBOM (CycloneDX)
        run: |
          set -euo pipefail
          trivy fs --format cyclonedx --scanners license \
            --output sbom.cyclonedx.json --quiet .
          node -e "const s=require('./sbom.cyclonedx.json');const n=(s.components||[]).length;if(!n)throw new Error('SBOM has no components');console.log('SBOM',s.specVersion,'components:',n)"

      # Created only now, with every asset attached in one call, so a failure
      # above cannot leave a published release missing its artifacts.
      - name: Create DRAFT release with artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # SemVer pre-release tags (containing a hyphen) are marked as GitHub
          # pre-releases so they do not claim the "Latest" badge.
          PRERELEASE=""
          case "${{ github.ref_name }}" in
            *-*) PRERELEASE="--prerelease" ;;
          esac
          assets=(
            packages/api/spec/openapi.yaml
            packages/api/spec/schema.graphql
            packages/api/spec/asyncapi.yaml
            sbom.cyclonedx.json
            image-digests.txt
            openfoundry-${{ steps.ver.outputs.version }}.tgz
          )
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" "${assets[@]}" --clobber
          else
            # Draft: nothing is publicly visible until provenance succeeds.
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes \
              --draft \
              $PRERELEASE \
              "${assets[@]}"
          fi

      # Signed, verifiable statement that these artifacts came from this
      # workflow at this commit: `gh attestation verify <file> --repo <repo>`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            openfoundry-${{ steps.ver.outputs.version }}.tgz
            image-digests.txt
            packages/api/spec/openapi.yaml
            packages/api/spec/schema.graphql
            packages/api/spec/asyncapi.yaml
            sbom.cyclonedx.json

      # Only now is the release made visible. A failure anywhere above leaves a
      # draft, not a published release advertising assurance it does not have.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false
