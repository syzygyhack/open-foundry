asyncapi: 2.6.0
info:
  title: Open Foundry Event API
  version: 0.2.4
  description: Real-time change events for the Open Foundry ontology platform.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  websocket:
    url: /graphql
    protocol: ws
    description: GraphQL WebSocket transport (graphql-ws protocol)
    security:
      - bearerAuth: []
channels:
  customerChanged:
    description: Changes to a specific Customer object (by ID).
    subscribe:
      operationId: onCustomerChanged
      summary: Receive change events for a single Customer
      message:
        name: CustomerChangeEvent
        payload: &a1
          type: object
          properties:
            changeType:
              type: string
              enum:
                - CREATED
                - UPDATED
                - DELETED
            object:
              type: object
              description: Customer object snapshot after the change.
              properties:
                id:
                  type: string
                  format: uuid
                _type:
                  type: string
                  const: Customer
            previousValues:
              type: object
              nullable: true
              description: Field-level diff (old/new) for UPDATED events.
            causedBy:
              type: object
              nullable: true
              properties:
                actionType:
                  type: string
                  nullable: true
                actionId:
                  type: string
                  nullable: true
            timestamp:
              type: string
              format: date-time
          required:
            - changeType
            - object
            - timestamp
    parameters:
      id:
        description: ID of the Customer to watch
        schema:
          type: string
          format: uuid
  customersChanged:
    description: Changes to any Customer object (optionally filtered).
    subscribe:
      operationId: onCustomersChanged
      summary: Receive change events for Customer objects
      message:
        name: CustomerChangeEvent
        payload: *a1
    parameters:
      filter:
        description: Optional JSON filter to narrow the subscription
        schema:
          type: object
