  /api/v1/relationships:
    post:
      tags:
        - Governance
      summary: Grant a directly-assignable ReBAC relationship (care-team)
      operationId: grantRelationship
      requestBody: &a2
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user
                - relation
                - objectType
                - objectId
              properties:
                user:
                  type: string
                  description: Subject user id (bare or `user:<id>`).
                relation:
                  type: string
                  description: A directly-grantable `[user]` relation from the merged FGA model.
                objectType:
                  type: string
                  description: Object type (e.g. Patient, Ward).
                objectId:
                  type: string
      responses:
        "200":
          description: Relationship granted
        "400":
          description: Invalid/non-grantable relation or missing field
          content: &a1
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller lacks a granter role
          content: *a1
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags:
        - Governance
      summary: Revoke a directly-assignable ReBAC relationship
      operationId: revokeRelationship
      requestBody: *a2
      responses:
        "200":
          description: Relationship revoked
        "400":
          description: Invalid/non-grantable relation or missing field
          content: *a1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller lacks a granter role
          content: *a1
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/consent:
    post:
      tags:
        - Governance
      summary: Record a consent decision for a data subject
      operationId: recordConsent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - subject
              properties:
                subject:
                  type: string
                  description: Consent subject id.
                purpose:
                  type: string
                  description: A DataPurpose from the deployment vocabulary (CONSENT_PURPOSES); default DEFAULT_CONSENT_PURPOSE.
                decision:
                  type: string
                  enum:
                    - GRANT
                    - DENY
                  default: GRANT
                evidence:
                  type: string
      responses:
        "200":
          description: Consent recorded
        "400":
          description: Validation error (unknown purpose / invalid decision / missing subject)
          content: *a1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller lacks a consent-recorder role
          content: *a1
        "429":
          $ref: "#/components/responses/RateLimited"
